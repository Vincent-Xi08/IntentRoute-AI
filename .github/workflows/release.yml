name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET 8
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 8.0.424

      - name: Verify tag matches project version
        shell: pwsh
        run: |
          [xml]$project = Get-Content ProxyManager.Standalone/ProxyManager.Standalone.csproj
          $version = [string]$project.Project.PropertyGroup.Version
          if ($env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match project version v$version"
          }

      - name: Test
        shell: pwsh
        run: ./scripts/test.ps1

      - name: Validate builder output with pinned real sing-box
        shell: pwsh
        run: ./scripts/test-pinned-sing-box.ps1

      - name: Check vulnerable dependencies
        shell: pwsh
        run: ./scripts/check-vulnerabilities.ps1

      - name: Publish
        shell: pwsh
        run: ./scripts/build.ps1 -OutputDirectory "$env:RUNNER_TEMP/package"

      - name: Smoke test published WPF app
        shell: pwsh
        run: ./scripts/smoke-test-wpf.ps1 -OutputDirectory "$env:RUNNER_TEMP/package"

      - name: Package and checksum
        shell: pwsh
        run: |
          Copy-Item README.md, LICENSE, THIRD_PARTY_NOTICES.md "$env:RUNNER_TEMP/package"
          @'
          IntentRoute AI does not include sing-box, an AI model, an API key, or a proxy service.
          Install sing-box v1.13+ separately from https://github.com/SagerNet/sing-box/releases
          Run IntentRoute AI as administrator, then use Settings > Browse on every launch to approve your separately installed sing-box.exe.
          '@ | Set-Content "$env:RUNNER_TEMP/package/README_RELEASE.txt" -Encoding utf8
          $archive = "IntentRoute-AI-$env:GITHUB_REF_NAME-win-x64.zip"
          Compress-Archive -Path "$env:RUNNER_TEMP/package/*" -DestinationPath $archive -CompressionLevel Optimal
          $hash = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          "$hash  $archive" | Set-Content "$archive.sha256" -Encoding ascii

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Curated notes come from the CHANGELOG section for this tag, extracted
          # by the same script test-release-notes.ps1 exercises for every version.
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          $notesPath = ./scripts/make-release-notes.ps1 -Version $version
          $archive = (Get-Item IntentRoute-AI-*.zip).FullName
          $checksum = (Get-Item IntentRoute-AI-*.sha256).FullName
          gh release create "$env:GITHUB_REF_NAME" $archive $checksum --verify-tag --notes-file $notesPath --prerelease --title "IntentRoute AI $env:GITHUB_REF_NAME"
