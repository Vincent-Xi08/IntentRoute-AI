name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET 8
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.424
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore locked dependencies
        shell: pwsh
        run: dotnet restore ProxyManager.Tests/ProxyManager.Tests.csproj --locked-mode

      - name: Run tests
        shell: pwsh
        run: dotnet test ProxyManager.Tests/ProxyManager.Tests.csproj --configuration Release --no-restore --logger "trx;LogFileName=tests.trx"

      - name: Test and build Rust core (migration)
        shell: pwsh
        run: ./scripts/test-rust.ps1

      - name: Smoke test Rust console GUI
        shell: pwsh
        # Headless: hosted runners expose no GPU adapter for any backend, so
        # the same UI passes are driven off-screen instead of in a window.
        run: ./scripts/smoke-test-rust-gui.ps1 -Headless

      - name: Validate builder output with pinned real sing-box
        shell: pwsh
        run: ./scripts/test-pinned-sing-box.ps1

      - name: Validate release-notes extraction
        shell: pwsh
        run: ./scripts/test-release-notes.ps1

      - name: Check vulnerable dependencies
        shell: pwsh
        run: ./scripts/check-vulnerabilities.ps1

      - name: Publish Windows x64
        shell: pwsh
        run: ./scripts/build.ps1 -OutputDirectory "$env:RUNNER_TEMP/IntentRoute-AI-win-x64"

      - name: Smoke test published WPF app
        shell: pwsh
        run: ./scripts/smoke-test-wpf.ps1 -OutputDirectory "$env:RUNNER_TEMP/IntentRoute-AI-win-x64"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results
          path: '**/TestResults/*.trx'
          if-no-files-found: warn

      - name: Upload preview build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: IntentRoute-AI-win-x64
          path: ${{ runner.temp }}/IntentRoute-AI-win-x64/
          if-no-files-found: error

      - name: Upload Rust console preview (migration)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: IntentRoute-AI-rust-console
          path: rust/target/release/intentroute-gui.exe
          if-no-files-found: error
